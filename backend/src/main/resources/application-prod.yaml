spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  output:
    ansi:
      enabled: never

server:
  servlet:
    context-path: /money_tracker

# AI provider: OpenRouter (free tier) on Railway
ai:
  provider: xai

# OpenRouter — key injected from Railway environment variable
groq:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  model: openai/gpt-oss-120b:free
  temperature: 0.7
  max-tokens: 512

# CORS: allow the frontend origin (Railway frontend domain)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}
  allowed-origin-patterns: "*"
server:
  forward-headers-strategy: native
