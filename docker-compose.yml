services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:17-alpine
    container_name: money_tracker_db
    environment:
      POSTGRES_DB: money_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Backend (Spring Boot) ──
  # Ollama runs natively on Windows (not in Docker) for GPU acceleration.
  # The backend connects to Ollama via the host network.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: money_tracker_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/money_tracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/money_tracker/api/v1/auth/ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Frontend (React + Nginx) ──
  # Dev only — Railway deployment uses Dockerfile.prod + nginx runtime proxy.
  # BACKEND_URL is injected at container start via envsubst in Dockerfile.prod.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: money_tracker_frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local


    
